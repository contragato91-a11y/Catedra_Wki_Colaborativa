<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki académica · RAEE en centros de salud comunitarios</title>
<style>
:root{--dk:#0b5d3b;--dk2:#07402a;--lt:#8cc63f;--lt2:#eaf5d8;--bg:#fff;--tx:#17261e;--mu:#52645a;--ln:#d5e4d0;--r:10px;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:17px/1.7 Georgia,"Times New Roman",serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit}
.ui,button,input,select,textarea,nav,header,label,summary h2{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[id]{scroll-margin-top:84px}
:focus-visible{outline:3px solid var(--lt);outline-offset:2px}
header{position:sticky;top:0;z-index:30;display:flex;gap:.6rem;align-items:center;padding:.6rem 1rem;background:var(--dk);color:#fff;border-bottom:4px solid var(--lt)}
header .brand{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch}
.btn{border:0;border-radius:8px;padding:.5rem .9rem;background:var(--lt);color:var(--dk2);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}.btn.sec{background:#fff;color:var(--dk);border:1px solid var(--dk)}.btn.sm{padding:.3rem .6rem;font-size:.85rem}
#menuBtn{display:none}
.sw{position:relative;flex:1;max-width:520px;margin-left:auto}
.sw input{width:100%;padding:.5rem .8rem;border-radius:8px;border:0}
#res{position:absolute;top:110%;left:0;right:0;max-height:60vh;overflow:auto;background:#fff;color:var(--tx);border-radius:var(--r);box-shadow:0 12px 32px #0004;display:none}
#res.on{display:block}#res p{margin:0;padding:.7rem 1rem;font-size:.9rem;line-height:1.45}
#res a{display:block;padding:.6rem 1rem;color:inherit;text-decoration:none;border-bottom:1px solid var(--ln);font-size:.9rem;line-height:1.45}
#res a:hover,#res a:focus{background:var(--lt2)}#res small{color:var(--dk);font-weight:700;display:block}
mark{background:#d8ee9f;padding:0 2px}
.wrap{display:flex;min-height:calc(100vh - 62px)}
aside{width:290px;flex:none;background:var(--dk2);color:#fff;padding:1.2rem 0;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
aside h4{margin:1.2rem 1.2rem .3rem;font:700 .8rem system-ui;color:var(--lt);letter-spacing:.04em}
aside a{display:block;padding:.45rem 1.2rem;color:#e6f2e0;text-decoration:none;font-size:.95rem;border-left:4px solid transparent}
aside a:hover{background:#ffffff14}aside a[aria-current=true]{border-left-color:var(--lt);background:#ffffff1f;font-weight:600}
main{flex:1;min-width:0;padding:2rem clamp(1rem,4vw,3.5rem) 4rem;max-width:960px}
.hero{background:linear-gradient(135deg,var(--dk),var(--dk2));color:#fff;border-radius:16px;padding:2rem;border-left:10px solid var(--lt)}
.hero h1{margin:0 0 .5rem;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.2}.hero p{margin:0;color:#dcecd2;font-family:system-ui,sans-serif;font-size:.95rem}
.toc{margin:1.5rem 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem;padding:0;list-style:none}
.toc a{display:block;height:100%;padding:.8rem 1rem;border:1px solid var(--ln);border-left:5px solid var(--lt);border-radius:var(--r);text-decoration:none;color:var(--dk);font:600 .95rem system-ui}
.toc a:hover{background:var(--lt2)}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
details.sec{border:1px solid var(--ln);border-radius:14px;margin:1rem 0;background:#fff}
details.sec>summary{cursor:pointer;padding:.9rem 1.2rem;list-style:none;background:var(--lt2);border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:1rem}
details.sec[open]>summary{border-radius:14px 14px 0 0;border-bottom:3px solid var(--lt)}
summary::-webkit-details-marker{display:none}
summary h2{margin:0;font-size:1.2rem;color:var(--dk2)}summary::after{content:"+";font:700 1.4rem system-ui;color:var(--dk)}details[open]>summary::after{content:"–"}
.body{padding:.5rem 1.4rem 1.2rem}.body p{text-align:justify;hyphens:auto}.body h3{color:var(--dk);font:700 1.05rem system-ui;margin:1.4rem 0 .3rem}
.body li{margin:.5rem 0}
details.alt{border:1px solid var(--ln);border-radius:var(--r);margin:.6rem 0}details.alt>summary{padding:.7rem 1rem;cursor:pointer;font:600 .95rem/1.4 system-ui;color:var(--dk2);display:block}
details.alt>summary::after{content:none}details.alt[open]>summary{background:var(--lt2)}details.alt p{margin:.6rem 1rem}.nodo{border-left:4px solid var(--lt);padding-left:.8rem}
.hit{animation:hit 1.8s}@keyframes hit{0%,60%{background:#e6f5bd}}
form{display:grid;gap:.7rem;margin:.8rem 0}label{display:grid;gap:.2rem;font-size:.9rem;font-weight:600;color:var(--dk2)}
input,select,textarea{padding:.55rem .7rem;border:1px solid #9db8a6;border-radius:8px;background:#fff;color:var(--tx)}
.list{list-style:none;padding:0;font:.9rem/1.5 system-ui}.list li{border:1px solid var(--ln);border-radius:8px;padding:.6rem .8rem;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.list b{display:block;color:var(--dk)}
#top{position:fixed;right:1rem;bottom:1rem;z-index:20;box-shadow:0 4px 14px #0003;display:none}#top.on{display:block}
footer{margin-top:2rem;font:.85rem system-ui;color:var(--mu)}
@media(max-width:860px){#menuBtn{display:block}aside{position:fixed;left:0;top:62px;z-index:25;transform:translateX(-100%);transition:transform .25s}aside.open{transform:none}header .brand{display:none}.body p{text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.gal{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;align-items:flex-start;margin:1.1rem 0}
.gal figure{margin:0}.gal img{display:block;width:auto;height:auto;max-width:100%;border-radius:8px;border:1px solid var(--ln);background:var(--lt2)}
.hero .auth{margin-top:.9rem;padding-top:.7rem;border-top:1px solid rgba(255,255,255,.25);color:#fff}.hero .auth b{display:block;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:#cfe7c0;margin-bottom:.3rem}.hero .auth span{display:inline-block;margin:.1rem 1rem .1rem 0;font-weight:600}
.refs li{margin:.5rem 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<header class="ui">
<button class="btn" id="menuBtn" aria-expanded="false" aria-controls="side"></button>
<span class="brand" id="brand"></span>
<div class="sw"><input id="q" type="search" autocomplete="off" aria-controls="res"><div id="res" role="region" aria-live="polite"></div></div>
<button class="btn" id="lang"></button>
</header>
<div class="wrap">
<aside id="side"><nav id="nav"></nav></aside>
<main id="main"></main>
</div>

{id:"s1",cat:0,t:"1. Identificación del problema",b:[
"El problema que asumimos como reto es la **deficiente gestión de residuos de aparatos eléctricos y electrónicos (RAEE) hospitalarios y de baja complejidad** en centros de salud comunitarios, afectando el medio ambiente y la salud pública local."]},
{id:"s2",cat:0,t:"2. Descripción del problema",b:[
"Vivimos en una época de constante aceleración tecnológica donde el siglo XXI nos bombardea con la adquisición masiva de equipos médicos y dispositivos digitales de uso cotidiano en el sector salud (computadoras, tensiómetros digitales, glucómetros, tabletas de historias clínicas electrónicas, entre otros). Sin embargo, este vertiginoso avance ha traído consigo una crisis invisible pero latente en los entornos comunitarios y de atención básica: la acumulación y el manejo inadecuado de los Residuos de Aparatos Eléctricos y Electrónicos (RAEE).",
"En nuestra localidad, diversos centros de salud de baja complejidad, consultorios particulares e incluso hogares que manejan pacientes domiciliarios enfrentan un dilema crítico. Cuando estos aparatos cumplen su ciclo de vida útil o sufren obsolescencia tecnológica, terminan siendo desechados junto con la basura común, o bien, almacenados en depósitos improvisados dentro de las mismas instituciones prestadoras de servicios de salud (IPS). Esta situación vulnera directamente el bienestar del **ser humano**. Por un lado, expone al personal administrativo, asistencial y a los pacientes a sustancias altamente tóxicas como plomo, mercurio, cadmio y retardantes de llama bromados, liberados cuando estos aparatos se degradan o son manipulados sin protección. Por otro lado, impacta la salud mental y física de la comunidad al generar un entorno de insalubridad y estrés ambiental.",
"Desde la perspectiva del **siglo XXI**, esta problemática evidencia una paradoja tecnológica: la misma digitalización y modernización que busca mejorar la oportunidad y calidad de los diagnósticos en salud está generando una estela de contaminación tóxica debido a la falta de infraestructura y cultura de reciclaje tecnológico especializado. Las normativas actuales a menudo se quedan en el papel para los pequeños centros de salud, que carecen de presupuestos o de una guía clara para gestionar estos residuos de forma segura.",
"Finalmente, al conectar este escenario con los **Objetivos de Desarrollo Sostenible (ODS)**, encontramos una colisión directa con varias metas globales. En primer lugar, choca con el **ODS 3 (Salud y Bienestar)**, ya que la exposición a metales pesados derivados de los RAEE contamina el aire, el suelo y las fuentes hídricas, provocando enfermedades respiratorias, neurológicas y dermatológicas en la población circundante. En segundo lugar, vulnera el **ODS 12 (Producción y Consumo Responsables)** al evidenciar una economía lineal insostenible (\"comprar, usar y desechar\") que ignora el reaprovechamiento de materiales valiosos. Por último, reta el **ODS 11 (Ciudades y Comunidades Sostenibles)** y el **ODS 13 (Acción por el Clima)**, recordándonos que como futuros administradores en salud no podemos gestionar hospitales eficientes si ignoramos el impacto ambiental que nuestra propia operación genera en el planeta."]},
{id:"s3",cat:0,t:"3. Sustento del problema",b:[
"Abordar la gestión inadecuada de los RAEE en el sector salud no es solo una cuestión de cumplimiento ambiental, sino una necesidad ética, social y administrativa ineludible. Es necesario intervenir en este problema porque la tendencia de digitalización en salud va en aumento, y de no establecer protocolos tempranos en las instituciones de baja complejidad, nos enfrentaremos a una crisis sanitaria superpuesta a la carga de enfermedad tradicional de nuestras comunidades.",
"El **mundo del saber**, enmarcado en la academia y en nuestra formación profesional como administradores en salud, posee las herramientas conceptuales, científicas y técnicas para dar respuesta a esta problemática. A través de la planeación estratégica, la gestión de la calidad, la ingeniería sanitaria y la optimización de procesos, podemos diseñar rutas logísticas claras para la recolección, clasificación y disposición final de estos residuos peligrosos. El conocimiento universitario no debe quedarse en las aulas ni en los libros; debe traducirse en propuestas prácticas que articulen a las IPS con gestores ambientales autorizados, transformando un pasivo ambiental en un proceso seguro y regulado.",
"Asimismo, es fundamental abordar este problema desde el **humanismo** y, más específicamente, desde el **Humanismo Digital**. En la actualidad, el centro de la atención en salud no puede ser únicamente la enfermedad del paciente ni la eficiencia financiera de la institución; debe ser la vida en todas sus dimensiones, incluyendo el hábitat donde cohabitamos. El humanismo digital nos convoca a reflexionar críticamente sobre nuestra relación con la tecnología: no podemos celebrar los beneficios de la era digital y la telemedicina ignorando el costo ecológico y humano que pagan las poblaciones vulnerables donde se desechan estos dispositivos obsoletos.",
"Como lo plantea la reflexión sobre la felicidad y el bienestar común, el objetivo del ser humano no radica en la acumulación desmedida de bienes tecnológicos o en la eficiencia ciega de los procesos institucionales, sino en la transformación positiva de la vida propia y de la comunidad. Cuidar de nuestro entorno a través de una administración en salud consciente y sostenible es un acto de empatía intergeneracional. Este reto nos invita a demostrar que el conocimiento adquirido en Areandina tiene un propósito transformador: formar profesionales capaces de equilibrar la innovación tecnológica con la defensa de la vida y la dignidad humana."]},
{id:"s4",cat:1,t:"4. Causas y consecuencias",b:[
{h:"Causas del problema"},
{ul:["**Ausencia de protocolos específicos:** Muchas IPS de baja complejidad no cuentan con manuales internos ni rutas claras para la baja, almacenamiento temporal y entrega de equipos tecnológicos obsoletos.",
"**Desconocimiento normativo:** Falta de capacitación al personal administrativo y de salud sobre la peligrosidad de los componentes de los RAEE y la legislación ambiental vigente (como el marco de gestión de residuos peligrosos).",
"**Cultura de consumo y descarte:** Predominio de un modelo lineal donde se adquieren nuevos dispositivos sin planificar su disposición final al término de su vida útil.",
"**Falta de articulación local:** Escasa vinculación entre los pequeños centros de salud y las empresas gestoras de residuos tecnológicos autorizadas debido a supuestos costos elevados o desconocimiento de alianzas estratégicas."]},
{h:"Consecuencias del problema"},
{ul:["**Sociales:** Aumento de riesgos en la salud de los trabajadores de la salud, pacientes y recicladores informales debido a la exposición a sustancias tóxicas como plomo y mercurio.",
"**Económicas:** Posibles sanciones legales, multas institucionales y sobrecostos por la gestión inadecuada o acumulación desordenada de equipos en desuso dentro de las instalaciones.",
"**Ambientales:** Contaminación severa de fuentes hídricas y suelos locales por la filtración de metales pesados provenientes de circuitos impresos y baterías de dispositivos médicos descartados en la basura común.",
"**Políticas:** Debilidad en el cumplimiento de los indicadores de sostenibilidad institucional y deterioro de la imagen pública de los centros de salud ante la comunidad y los entes de control territorial."]}]},
{id:"s5",cat:2,t:"5. Alternativas de solución",b:[
"Para dar respuesta a este reto, proponemos 4 alternativas de solución, articuladas directamente con los nodos del **Sello Transformador Arandino** estudiados en el eje 2:",
{alts:[
["Campaña de concientización y alfabetización ambiental (\"Tecnología con Conciencia\")","Desarrollar talleres educativos y piezas comunicativas dirigidas al personal de las IPS y a la comunidad usuaria sobre los riesgos de los RAEE y la correcta separación en la fuente.","*Nodo relacionado:* **Competencias lingüísticas**, ya que exige una comunicación clara, persuasiva y adaptada a diferentes públicos para transmitir un mensaje de alto impacto social."],
["Diseño de un prototipo de Ruta Logística de Reciclaje Tecnológico (Eco-Ruta Salud)","Crear un plan piloto de recolección interna y un formato de entrega programada de equipos obsoletos articulado con gestores ambientales certificados de la región.","*Nodo relacionado:* **Creatividad, innovación y emprendimiento**, al proponer un modelo práctico, novedoso y de bajo costo para resolver una falla operativa tradicional en centros de baja complejidad."],
["Jornada comunitaria de recolección \"Punto Verde Hospitalario\"","Establecer un espacio temporal en el centro de salud donde la comunidad pueda llevar sus pequeños dispositivos médicos y electrónicos en desuso para evitar que lleguen a la basura común.","*Nodo relacionado:* **Humanismo Digital**, puesto que nos invita a reflexionar sobre nuestra responsabilidad ética frente al impacto de la tecnología, priorizando el cuidado de la vida humana y del planeta por encima del consumo desmedido."],
["Creación de una guía digital interactiva para administradores en salud","Desarrollar un documento digital de fácil acceso (infografía interactiva o app básica) con el paso a paso normativo y operativo para la gestión de RAEE en microempresas y centros de salud comunitarios.","*Nodo relacionado:* **Humanismo Digital** y **Competencias lingüísticas**, combinando el uso ético de las herramientas tecnológicas de la información con una redacción clara, cohesiva y orientada al servicio de la gestión en salud."]]}]},
{"id": "s6", "cat": 2, "t": "6. Descripción de la solución del problema", "b": ["Para dar respuesta definitiva a la problemática de los RAEE en el centro de salud comunitario, nuestro equipo desarrolló e implementó de manera integrada la **\"Eco-Ruta Salud\"** combinada con la jornada comunitaria **\"Punto Verde Hospitalario\"** y una campaña de alfabetización ambiental basada en el Humanismo Digital.", "La acción se ejecutó en el Centro de Salud Comunitario San Rafael durante tres semanas. En la **primera fase**, realizamos un inventario y baja técnica de equipos médicos obsoletos acumulados en depósitos improvisados (glucómetros dañados, computadoras en desuso, tensiómetros digitales averiados y cables acumulados). Paralelamente, capacitamos al personal asistencial y administrativo sobre la segregación adecuada de estos residuos peligrosos para evitar su mezcla con la basura común.", "En la **segunda fase**, establecimos una alianza estratégica con un gestor ambiental autorizado de la región y diseñamos la **\"Eco-Ruta Salud\"**, un protocolo logístico interno que estandariza la recolección, el almacenamiento temporal seguro en un espacio señalizado y el despacho formal de los aparatos. Como punto clave de vinculación comunitaria, llevamos a cabo el **\"Punto Verde Hospitalario\"**, un evento abierto de un fin de semana donde tanto el centro de salud como los pacientes domiciliarios pudieron entregar sus pequeños dispositivos electrónicos obsoletos.", "Esta solución no solo corrigió el almacenamiento desordenado y el riesgo de exposición a metales pesados (plomo y mercurio), sino que transformó un pasivo ambiental y normativo en un modelo de economía circular replicable. Al integrar la tecnología con la ética del cuidado, demostramos que la administración en salud eficiente debe salvaguardar tanto la vida humana como el equilibrio de nuestro entorno natural."]},
{"id": "s7", "cat": 3, "t": "7. Descripción de los recursos requeridos", "b": ["Para llevar a cabo con éxito la implementación de la Eco-Ruta Salud y el Punto Verde Hospitalario, se requirió una articulación eficiente de recursos humanos, materiales y digitales:", {"h": "Recursos Humanos"}, {"ul": ["**Estudiantes líderes del proyecto:** Coordinadores de la logística, diseño de protocolos y facilitadores de las capacitaciones.", "**Personal administrativo y asistencial del centro de salud:** Participantes activos en la identificación, clasificación y entrega de equipos en desuso.", "**Gestor ambiental autorizado:** Personal técnico de la empresa de reciclaje tecnológico aliada, encargada de la recolección final, certificación de disposición y transporte seguro.", "**Comunidad usuaria y pacientes domiciliarios:** Actores clave que participaron activamente entregando sus dispositivos en el Punto Verde."]}, {"h": "Recursos Materiales y Físicos"}, {"ul": ["**Espacio temporal de acopio (\"Punto Verde\"):** Carpa institucional, mesas de recepción, estibas plásticas y contenedores especiales debidamente rotulados para residuos peligrosos electrónicos.", "**Elementos de Protección Personal (EPP):** Guantes de nitrito, gafas de seguridad y mascarillas para el personal manipulador de equipos oxidados o con posibles fugas de componentes.", "**Insumos de señalización y empaque:** Cintas de demarcación, bolsas plásticas de alta resistencia, precintos de seguridad y estibas para evitar el contacto de los RAEE con el suelo."]}, {"h": "Recursos Digitales y Tecnológicos"}, {"ul": ["**Guía digital interactiva: Infografía:** Diseñada en herramientas digitales para orientar al personal y a la comunidad sobre la ruta de entrega de RAEE."]}, {"fig": [{"k": "i1", "a": "Infografía «Eco-Ruta Saludable: Juntos por una IPS más sostenible», con los apartados Problema, ¿A quién va dirigida?, Nuestra solución, ¿Cómo lo haremos?, Recursos, Evidencias, Análisis de resultados (DOFA) y Nuestro impacto."}], "mh": 520}, {"ul": ["**Plataforma de registro y trazabilidad:** Hojas de cálculo en la nube para llevar el inventario de equipos dados de baja y el peso total recolectado (en kilogramos).", "**Equipos audiovisuales:** Proyectores y tabletas para impartir los talleres de alfabetización ambiental al personal del centro de salud."]}]},
{"id": "s8", "cat": 3, "t": "8. Evidencias de la implementación de la acción", "b": ["A continuación, presentamos el registro detallado de las evidencias recopiladas durante las diferentes fases de la ejecución del proyecto en campo, vinculadas a repositorios institucionales para su respectiva validación:", {"h": "Capacitación y sensibilización al personal de salud"}, "*Descripción:* Fotografías del taller dictado al personal administrativo y asistencial sobre la identificación de componentes tóxicos en equipos médicos obsoletos y la socialización del nuevo protocolo de la \"Eco-Ruta Salud\".", {"fig": [{"k": "i2", "a": "Personal del centro de salud reunido junto a un mostrador durante la capacitación."}, {"k": "i3", "a": "Personal asistencial reunido en un pasillo durante la socialización del protocolo."}, {"k": "i4", "a": "Taller con el personal sentado atendiendo al facilitador en una sala."}, {"k": "i5", "a": "Capacitación en una sala con ventanas: una facilitadora frente al personal sentado."}], "mh": 260}, {"h": "Jornada comunitaria \"Punto Verde Hospitalario\""}, "*Descripción:* Registro fotográfico de la instalación del punto de acopio temporal en la entrada del centro de salud, mostrando la recepción activa de glucómetros, tabletas y pequeños aparatos electrónicos aportados por la comunidad. Incluye entrevista corta a un paciente domiciliario.", {"fig": [{"k": "i6", "a": "Depósito improvisado con letrero RAEE, una caneca con cables y cajas de equipos."}, {"k": "i7", "a": "Contenedor azul rotulado para depositar aparatos eléctricos y electrónicos que ya no se usan o no funcionan."}, {"k": "i8", "a": "Contenedor del punto de acopio con secciones para aparatos eléctricos y electrónicos, bombillos y luminarias, y pilas y baterías."}], "mh": 300}, {"h": "Entrega formal al gestor ambiental autorizado y certificación"}, "*Descripción:* Fotografías del proceso de carga de los residuos recolectados al vehículo del operador certificado, junto con la imagen del acta de entrega y disposición final segura emitida por la empresa gestora.", {"fig": [{"k": "i9", "a": "Collage de la entrega al gestor ambiental autorizado: firma del acta entre el Centro de Salud Comunitario San Rafael y el gestor, carga de los residuos en el vehículo, imagen del acta de entrega de RAEE y el equipo del centro de salud con el gestor ambiental."}], "mh": 380}]},
{"id": "s9", "cat": 1, "t": "9. Análisis de la solución", "b": ["La implementación de la \"Eco-Ruta Salud\" y el \"Punto Verde Hospitalario\" representó un ejercicio de profundo aprendizaje y transformación práctica, permitiéndonos aplicar las herramientas conceptuales de nuestra formación como administradores en salud bajo un enfoque de pensamiento crítico y gestión estratégica.", "Entre los principales **aciertos y fortalezas** de la intervención destaca la excelente articulación interinstitucional lograda con el gestor ambiental certificado, lo que garantizó que los residuos no terminaran en el relleno sanitario común, cumpliendo a cabalidad con el ODS 12 (Producción y Consumos Responsables) y el ODS 3 (Salud y Bienestar). Asimismo, la jornada \"Punto Verde Hospitalario\" superó las expectativas de participación ciudadana, recolectando más de 85 kilogramos de RAEE en un solo fin de semana. Esto demostró que cuando se educa a la comunidad bajo los principios del Humanismo Digital —conectando la innovación tecnológica con la responsabilidad ecológica— la respuesta social es altamente colaborativa y empática. Operativamente, el diseño de la ruta logística interna redujo el desorden en los almacenes del centro de salud, disminuyendo riesgos laborales por exposición a metales pesados.", "No obstante, el análisis crítico también nos permitió identificar **debilidades y amenazas** latentes. Una de las principales debilidades iniciales fue la resistencia al cambio por parte de cierto sector del personal administrativo, quienes percibían el proceso de baja y clasificación de equipos como una carga burocrática adicional a sus labores cotidianas. Asimismo, como amenaza externa, se evidenció la limitación presupuestal de los centros de salud de baja complejidad para mantener contratos permanentes de recolección especializada, ya que los costos logísticos de los operadores a veces superan los recursos disponibles de estas microempresas sanitarias.", "A partir de estas debilidades y amenazas, surgen valiosas **oportunidades de mejora** para futuras fases del proyecto. Es indispensable institucionalizar la Eco-Ruta Salud mediante una política interna obligatoria y automatizar el registro de inventarios tecnológicos mediante una aplicación digital de bajo costo. Además, se recomienda establecer convenios interinstitucionales a nivel municipal o de redes integradas de salud para abaratar los costos del servicio de los gestores ambientales mediante economías de escala. En conclusión, este reto reafirmó que la administración en salud no solo gestiona camas y presupuestos, sino que tiene el deber ético de liderar la sostenibilidad ambiental de los territorios donde opera."]}

{id:"s1",cat:0,t:"1. Problem identification",b:[
"The problem we take on as our challenge is the **deficient management of hospital and low-complexity waste electrical and electronic equipment (WEEE; RAEE in Spanish)** in community health centers, affecting the environment and local public health."]},
{id:"s2",cat:0,t:"2. Problem description",b:[
"We live in an era of constant technological acceleration in which the 21st century bombards us with the massive acquisition of medical equipment and everyday digital devices in the health sector (computers, digital blood pressure monitors, glucometers, tablets for electronic health records, among others). However, this dizzying progress has brought with it an invisible but latent crisis in community and primary care settings: the accumulation and improper handling of Waste Electrical and Electronic Equipment (WEEE).",
"In our locality, various low-complexity health centers, private practices and even homes caring for home-based patients face a critical dilemma. When these devices reach the end of their useful life or become technologically obsolete, they end up being thrown out with ordinary trash, or stored in improvised depots inside the very health service provider institutions (IPS). This situation directly undermines the well-being of the **human being**. On the one hand, it exposes administrative and care staff and patients to highly toxic substances such as lead, mercury, cadmium and brominated flame retardants, released when these devices degrade or are handled without protection. On the other hand, it affects the mental and physical health of the community by creating an unsanitary environment and environmental stress.",
"From the perspective of the **21st century**, this problem reveals a technological paradox: the very digitalization and modernization that seeks to improve the timeliness and quality of health diagnoses is generating a trail of toxic contamination due to the lack of infrastructure and of a culture of specialized technology recycling. Current regulations often remain on paper for small health centers, which lack budgets or a clear guide to manage this waste safely.",
"Finally, when connecting this scenario with the **Sustainable Development Goals (SDGs)**, we find a direct collision with several global goals. First, it clashes with **SDG 3 (Good Health and Well-being)**, since exposure to heavy metals from WEEE contaminates air, soil and water sources, causing respiratory, neurological and dermatological diseases in the surrounding population. Second, it undermines **SDG 12 (Responsible Consumption and Production)** by exposing an unsustainable linear economy (\"buy, use and discard\") that ignores the reuse of valuable materials. Lastly, it challenges **SDG 11 (Sustainable Cities and Communities)** and **SDG 13 (Climate Action)**, reminding us that as future health administrators we cannot run efficient hospitals if we ignore the environmental impact that our own operation has on the planet."]},
{id:"s3",cat:0,t:"3. Rationale for the problem",b:[
"Addressing the improper management of WEEE in the health sector is not only a matter of environmental compliance, but an unavoidable ethical, social and administrative necessity. Intervening in this problem is necessary because the trend toward digitalization in health is growing, and if early protocols are not established in low-complexity institutions, we will face a health crisis superimposed on the traditional disease burden of our communities.",
"The **world of knowledge**, framed within academia and our professional training as health administrators, has the conceptual, scientific and technical tools to respond to this problem. Through strategic planning, quality management, sanitary engineering and process optimization, we can design clear logistics routes for the collection, classification and final disposal of this hazardous waste. University knowledge must not remain in classrooms and books; it must translate into practical proposals that connect IPS with authorized environmental managers, turning an environmental liability into a safe and regulated process.",
"It is likewise essential to approach this problem from **humanism** and, more specifically, from **Digital Humanism**. Today, the focus of health care cannot be solely the patient's disease or the institution's financial efficiency; it must be life in all its dimensions, including the habitat we share. Digital humanism calls on us to reflect critically on our relationship with technology: we cannot celebrate the benefits of the digital age and telemedicine while ignoring the ecological and human cost paid by the vulnerable populations where these obsolete devices are discarded.",
"As the reflection on happiness and the common good suggests, the goal of the human being does not lie in the excessive accumulation of technological goods or in the blind efficiency of institutional processes, but in the positive transformation of one's own life and that of the community. Caring for our environment through conscious and sustainable health administration is an act of intergenerational empathy. This challenge invites us to show that the knowledge acquired at Areandina has a transformative purpose: to train professionals capable of balancing technological innovation with the defense of life and human dignity."]},
{id:"s4",cat:1,t:"4. Causes and consequences",b:[
{h:"Causes of the problem"},
{ul:["**Absence of specific protocols:** Many low-complexity IPS have no internal manuals or clear routes for decommissioning, temporary storage and delivery of obsolete technological equipment.",
"**Lack of regulatory knowledge:** Lack of training for administrative and health staff on the hazardousness of WEEE components and on current environmental legislation (such as the hazardous waste management framework).",
"**Culture of consumption and disposal:** Predominance of a linear model in which new devices are acquired without planning their final disposal at the end of their useful life.",
"**Lack of local coordination:** Little connection between small health centers and authorized technology waste management companies due to supposed high costs or unawareness of strategic alliances."]},
{h:"Consequences of the problem"},
{ul:["**Social:** Increased health risks for health workers, patients and informal recyclers due to exposure to toxic substances such as lead and mercury.",
"**Economic:** Possible legal sanctions, institutional fines and extra costs from improper management or disorderly accumulation of unused equipment inside the facilities.",
"**Environmental:** Severe contamination of local water sources and soils from the leaching of heavy metals from printed circuits and batteries of medical devices discarded in ordinary trash.",
"**Political:** Weakness in meeting institutional sustainability indicators and damage to the public image of health centers before the community and territorial oversight bodies."]}]},
{id:"s5",cat:2,t:"5. Solution alternatives",b:[
"To respond to this challenge, we propose 4 solution alternatives, directly linked to the nodes of the **Arandino Transformative Seal** studied in axis 2:",
{alts:[
["Awareness and environmental literacy campaign (\"Technology with Conscience\")","Develop educational workshops and communication materials aimed at IPS staff and the user community about the risks of WEEE and proper separation at the source.","*Related node:* **Linguistic competencies**, since it requires clear, persuasive communication adapted to different audiences in order to convey a message of high social impact."],
["Design of a prototype Technology Recycling Logistics Route (Eco-Ruta Salud)","Create a pilot plan for internal collection and a scheduled-delivery format for obsolete equipment, coordinated with certified environmental managers in the region.","*Related node:* **Creativity, innovation and entrepreneurship**, by proposing a practical, novel and low-cost model to solve a traditional operational failure in low-complexity centers."],
["Community collection day \"Hospital Green Point\"","Set up a temporary space at the health center where the community can bring their small unused medical and electronic devices to keep them from reaching ordinary trash.","*Related node:* **Digital Humanism**, since it invites us to reflect on our ethical responsibility regarding the impact of technology, prioritizing the care of human life and the planet over excessive consumption."],
["Creation of an interactive digital guide for health administrators","Develop an easily accessible digital document (interactive infographic or basic app) with the regulatory and operational step-by-step for WEEE management in micro-enterprises and community health centers.","*Related node:* **Digital Humanism** and **Linguistic competencies**, combining the ethical use of information technology tools with clear, cohesive writing oriented to serving health management."]]}]},
{"id": "s6", "cat": 2, "t": "6. Description of the problem solution", "b": ["To give a definitive response to the WEEE problem at the community health center, our team developed and implemented, in an integrated way, the **\"Eco-Ruta Salud\"** combined with the community event **\"Hospital Green Point\"** and an environmental literacy campaign based on Digital Humanism.", "The action was carried out at the San Rafael Community Health Center over three weeks. In the **first phase**, we took an inventory and carried out the technical decommissioning of obsolete medical equipment accumulated in improvised depots (damaged glucometers, unused computers, faulty digital blood pressure monitors and piles of cables). In parallel, we trained care and administrative staff on the proper segregation of this hazardous waste to prevent it from mixing with ordinary trash.", "In the **second phase**, we established a strategic alliance with an authorized environmental manager in the region and designed the **\"Eco-Ruta Salud\"**, an internal logistics protocol that standardizes collection, safe temporary storage in a marked area, and the formal dispatch of the devices. As a key point of community engagement, we held the **\"Hospital Green Point\"**, a weekend-long open event where both the health center and home-based patients could hand in their small obsolete electronic devices.", "This solution not only corrected the disorderly storage and the risk of exposure to heavy metals (lead and mercury), but also turned an environmental and regulatory liability into a replicable circular economy model. By integrating technology with the ethics of care, we showed that efficient health administration must safeguard both human life and the balance of our natural environment."]},
{"id": "s7", "cat": 3, "t": "7. Description of the required resources", "b": ["To successfully carry out the implementation of the Eco-Ruta Salud and the Hospital Green Point, an efficient combination of human, material and digital resources was required:", {"h": "Human Resources"}, {"ul": ["**Student project leaders:** Coordinators of logistics, protocol design and facilitators of the training sessions.", "**Administrative and care staff of the health center:** Active participants in identifying, classifying and handing in unused equipment.", "**Authorized environmental manager:** Technical staff of the allied technology recycling company, in charge of final collection, disposal certification and safe transport.", "**User community and home-based patients:** Key actors who actively took part by handing in their devices at the Green Point."]}, {"h": "Material and Physical Resources"}, {"ul": ["**Temporary collection space (\"Green Point\"):** Institutional tent, reception tables, plastic pallets and special containers duly labeled for hazardous electronic waste.", "**Personal Protective Equipment (PPE):** Nitrile gloves, safety goggles and masks for staff handling oxidized equipment or equipment with possible component leaks.", "**Signage and packaging supplies:** Demarcation tapes, heavy-duty plastic bags, security seals and pallets to prevent WEEE from contacting the ground."]}, {"h": "Digital and Technological Resources"}, {"ul": ["**Interactive digital guide: Infographic:** Designed with digital tools to guide staff and the community on the WEEE delivery route."]}, {"fig": [{"k": "i1", "a": "Infographic \"Eco-Ruta Saludable: Juntos por una IPS más sostenible\" (Healthy Eco-Route: Together for a more sustainable IPS), with sections on Problem, Who is it for?, Our solution, How will we do it?, Resources, Evidence, Results analysis (SWOT) and Our impact."}], "mh": 520}, {"ul": ["**Registration and traceability platform:** Cloud spreadsheets to keep the inventory of decommissioned equipment and the total weight collected (in kilograms).", "**Audiovisual equipment:** Projectors and tablets to deliver the environmental literacy workshops to health center staff."]}]},
{"id": "s8", "cat": 3, "t": "8. Evidence of the implementation of the action", "b": ["Below we present the detailed record of the evidence gathered during the different phases of the field implementation of the project, linked to institutional repositories for their respective validation:", {"h": "Training and awareness-raising for health staff"}, "*Description:* Photographs of the workshop given to administrative and care staff on identifying toxic components in obsolete medical equipment and on introducing the new \"Eco-Ruta Salud\" protocol.", {"fig": [{"k": "i2", "a": "Health center staff gathered next to a counter during the training."}, {"k": "i3", "a": "Care staff gathered in a hallway during the presentation of the protocol."}, {"k": "i4", "a": "Workshop with seated staff listening to the facilitator in a room."}, {"k": "i5", "a": "Training in a room with windows: a facilitator in front of the seated staff."}], "mh": 260}, {"h": "Community event \"Hospital Green Point\""}, "*Description:* Photographic record of the setup of the temporary collection point at the entrance of the health center, showing the active reception of glucometers, tablets and small electronic devices contributed by the community. Includes a short interview with a home-based patient.", {"fig": [{"k": "i6", "a": "Improvised depot with a WEEE (RAEE) sign, a bin with cables and equipment boxes."}, {"k": "i7", "a": "Blue labeled container for depositing electrical and electronic devices that are no longer used or do not work."}, {"k": "i8", "a": "Collection point container with sections for electrical and electronic devices, light bulbs and lamps, and batteries."}], "mh": 300}, {"h": "Formal handover to the authorized environmental manager and certification"}, "*Description:* Photographs of the process of loading the collected waste onto the certified operator's vehicle, together with the image of the handover and safe final disposal certificate issued by the managing company.", {"fig": [{"k": "i9", "a": "Collage of the handover to the authorized environmental manager: signing of the certificate between the San Rafael Community Health Center and the manager, loading of the waste onto the vehicle, image of the WEEE handover certificate, and the health center team with the environmental manager."}], "mh": 380}]},
{"id": "s9", "cat": 1, "t": "9. Analysis of the solution", "b": ["The implementation of the \"Eco-Ruta Salud\" and the \"Hospital Green Point\" was an exercise in deep learning and practical transformation, allowing us to apply the conceptual tools of our training as health administrators under a critical-thinking and strategic-management approach.", "Among the main **successes and strengths** of the intervention stands out the excellent inter-institutional coordination achieved with the certified environmental manager, which ensured that the waste did not end up in the ordinary landfill, fully complying with SDG 12 (Responsible Consumption and Production) and SDG 3 (Good Health and Well-being). Likewise, the \"Hospital Green Point\" event exceeded expectations for citizen participation, collecting more than 85 kilograms of WEEE in a single weekend. This showed that when the community is educated under the principles of Digital Humanism —connecting technological innovation with ecological responsibility— the social response is highly collaborative and empathetic. Operationally, the design of the internal logistics route reduced disorder in the health center's storerooms, lowering occupational risks from exposure to heavy metals.", "However, the critical analysis also allowed us to identify latent **weaknesses and threats**. One of the main initial weaknesses was resistance to change from a certain segment of the administrative staff, who saw the process of decommissioning and classifying equipment as an additional bureaucratic burden on their daily tasks. Likewise, as an external threat, the budget limitations of low-complexity health centers to maintain permanent specialized collection contracts became evident, since the operators' logistics costs sometimes exceed the available resources of these health micro-enterprises.", "From these weaknesses and threats, valuable **opportunities for improvement** arise for future phases of the project. It is essential to institutionalize the Eco-Ruta Salud through a mandatory internal policy and to automate the recording of technology inventories through a low-cost digital application. In addition, it is recommended to establish inter-institutional agreements at the municipal level or within integrated health networks to lower the service costs of environmental managers through economies of scale. In conclusion, this challenge reaffirmed that health administration not only manages beds and budgets, but has the ethical duty to lead the environmental sustainability of the territories where it operates."]}
]};

 if(!q){box.classList.remove("on");box.innerHTML="";return}

 box.classList.add("on")}
